<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Halloween Movies Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Poppins:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/galeria.css">
    <link
    href="https://fonts.googleapis.com/css2?display=swap&amp;family=KoHo:ital,wght@0,400;0,700;1,400;1,700&amp;family=Krona+One:ital,wght@0,400;1,400&amp;family=Inter:ital,wght@0,400;0,700;1,400;1,700"
    rel="stylesheet" type="text/css">
    <!-- Option 1: Include in HTML -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css">
</head>

<body>
    <div class="ambient-bg"></div>
    <div class="particles-container"></div>


    <main>
        <div class="carousel-container">
            <div class="carousel" id="movieCarousel"></div>
        </div>

        <div class="controls">
            <button class="control-btn" id="prevBtn" aria-label="Previous movie">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </button>

            <button class="control-btn" id="playBtn" aria-label="Play/Pause autoplay">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 3l14 9-14 9V3z" />
                </svg>
            </button>

            <button class="control-btn" id="nextBtn" aria-label="Next movie">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6" />
                </svg>
            </button>
        </div>

        <div class="movie-info" id="movieInfo">
            <div class="info-content">
                <h2></h2>
                <p class="director"></p>
                <p class="description"></p>
                <div class="rating"></div>
            </div>
            <div class="info-background"></div>
        </div>
    </main>

    <div class="cursorhome">
        <div class="cursor__circle cursor__circle--small"></div>
        <div class="cursor__circle cursor__circle--large"></div>
    </div>
    
    <script src="assets/js/galeria.js"></script>
</body>

</html>
